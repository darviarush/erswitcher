Super+Shift+Break=Готово.

[commands]
# Команды операционной системы. Выполняются в оболочке шелла
Alt+Control+Shift+Break=kate ~/.config/erswitcher.conf && killall -HUP erswitcher
Alt+Control+t=trans ru:en -b -i %i -o %o -no-rlwrap -no-init
Alt+Control+y=trans en:ru -b -i %i -o %o -no-rlwrap -no-init
Control+F1=perl -e 'use DDP hash_separator => " => "; print np my $x=eval join "", <STDIN>' < %i &> %o
Control+F3=perl -e 'print join("", <>) =~ s/^(.*)\s*(if|when|while|for)\s*(.*)$/$2($3) { $1 }/s' %i &> %o
Control+F5=bash < %i &> %o

