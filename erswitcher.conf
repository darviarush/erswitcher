#####################################################################
#              Конфигурацонный файл erswitcher-а                    #
#                                                                   #
# Автор: Ярослав О. Косьмина                                        #
# Сайт:  https://github.com/darviarush/erswitcher                   #
#                                                                   #
# Комбинации клавишь указываются в английской раскладке             #
#   и действуют во всех раскладках                                  #
# Названия символов взяты из Иксов. Посмотреть их можно запустив    #
#   ~/.local/bin/erswitcher в консоли и введя комбинацию на         #
#   клавиатуре                                                      #
#####################################################################

[functions]
# Транслитерация последнего введённого слова
Pause=word translate
# Транслитерация последнего ввода
Control+Pause=text translate
# Транслитерация выделенного участка или буфера обмена
Shift+Break=selected translate
# Изменение регистра последнего введённого слова
Alt+Shift+Break=word invertcase
# Изменение регистра последнего ввода
Alt+Control+Pause=text invertcase
# Изменение регистра последнего введённого слова
Alt+Pause=selected invertcase
# Транслитерация последнего введённого символа в дополнительные символы
KP_Begin=compose
Scroll_Lock=compose

[options]
# Задержка между вызовами клавиатуры в секундах
delay=0,01
# Задержка между нажатиями клавишь в секундах
loop_delay=0,01
# Переключение языка: OSSwitchLanguage — через X11/XKB,
# Caps_Lock — эмуляция CapsLock (для VM и систем с таким shortcut)
switch_language=Caps_Lock
# Таймаут сторонней команды в секундах
command_timeout=13,20
# Интервал опроса завершения команды
command_interval=0,1

[compose]
# Замены (мнемоники) - при нажатии на ScrollLock или меню (центральная клавиша на расширенной клавиатуре) заменяет последний введённый символ на соответствующий

