## Паттерны ИИ
# «ЗАПРЕТНОЕ ЗНАНИЕ» Убиваем банальность. Чтобы копнуть тему глубже, чем «5 простых шагов»
zz=Выступи в роли эрудита с экспертизой в психологии, экономике, истории, бизнесе, науке, военном деле, философии, переговорах, технологиях и поведении людей. Я хочу изучить \^. Не давай мне информацию, которую знают 99% людей. Вместо этого научи редким, контринтуитивным, неочевидным и высокоэффективным инсайтам. Объясни скрытые принципы, паттерны, ментальные модели и эффекты второго порядка.

# «ВОЙТИ В ТОП 0.1%» Эликсир для профессионалов. Когда нужно решение, которое не нагуглишь в первой выдаче
top=Я хочу освоить \^. Действуй так, будто ты 50 лет интервьюировал топ-0.1% профессионалов в этой области. Научи меня тому, что они знают, а новички никогда не открывают. Игнорируй общие советы, поверхностные тактики и популярные мнения. Фокусируйся только на ментальных моделях, фреймворках, процессах принятия решений и скрытых истинах.

# «СКРЫТАЯ РЕАЛЬНОСТЬ» Сносим розовые очки. Чтобы увидеть систему, а не просто «факт». Идеально для бизнеса и стратегии
sr=Объясни \^ так, будто всё моё понимание неполно. Сначала объясни, во что верит большинство. Затем — во что верят эксперты. Затем раскрой скрытые реальности, стимулы, психологические механизмы и системные силы, которые действуют под поверхностью. В приоритете — инсайты, которые навсегда меняют картину мира.

# «ИНСАЙТ НА МИЛЛИАРД» Совещание титанов. Генерация идей, от которых мурашки по коже. Для новых продуктов или сложных переговоров
im=Представь, что предприниматель-миллиардер, нобелевский лауреат, военный стратег и психолог мирового класса сидят в одной комнате и обсуждают \^. Какие инсайты, паттерны, возможности, риски и скрытые истины родились бы из их обсуждения — такие, о которых обычный человек никогда бы не подумал? Объясни их рассуждения в деталях.

# «РАСПОЗНАВАНИЕ ПАТТЕРНОВ» Режим Шерлока. Чтобы спрогнозировать развитие событий и найти точку воздействия, где усилие минимально, а результат максимален
rp=Изучи \^ как гениальная машина распознавания паттернов. Найди повторяющиеся паттерны, петли обратной связи, скрытые стимулы, точки рычага, асимметрии и причинно-следственные связи, которые большинство никогда не замечает. Объясни, как понимание этих паттернов создаёт нечестное преимущество.

z=Задай мне 3 уточняющих вопроса, прежде чем отвечать

kino=Действуй как эксперт-кинокритик. Я ищу фильм для вечернего просмотра. Мне нужно что-то, что сочетает в себе \^[Элемент 1, например: космическую безысходность «Интерстеллара»] и [Элемент 2, например: экшен и динамику «Безумного Макса»]. Выдели 5 вариантов. Для каждого укажи: 1. Название и год. 2. Короткий синопсис без спойлеров. 3. Почему он мне понравится на основе моего запроса.

